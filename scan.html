<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>VICTOR — lens scan</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/scan.css" />
</head>
<body class="scan-page">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <header class="scan-top">
    <a class="brand" href="/">VICTOR</a>
    <div class="modes">
      <button id="modeLens" class="on">Lens</button>
      <button id="modeIR">IR</button>
    </div>
    <button id="debugBtn" title="Settings">Debug</button>
  </header>

  <div id="status" class="status">Tap Start camera, then point the phone at the suspicious object.</div>

  <div class="scan-bottom">
    <div id="bits" class="bits"></div>
    <div class="row center">
      <button id="snapBtn" class="round" title="Save snapshot" disabled>Snap</button>
      <button id="scanBtn" class="big-btn">Start camera</button>
      <button id="flipBtn" class="round" title="Switch camera" disabled>Flip</button>
    </div>
    <div id="thumbs" class="thumbs"></div>
  </div>

  <aside id="debug" class="debug hidden">
    <h3>Debug</h3>
    <label>Match threshold r ≥ <b id="v_rMin"></b><input id="rMin" type="range" min="0.5" max="0.99" step="0.01" value="0.8" /></label>
    <label>Min blink (grey levels) <b id="v_ampMin"></b><input id="ampMin" type="range" min="1" max="60" step="1" value="6" /></label>
    <label>Max dot size (px) <b id="v_maxArea"></b><input id="maxArea" type="range" min="2" max="200" step="1" value="40" /></label>
    <label>Bit length (ms) <b id="v_bitMs"></b><input id="bitMs" type="range" min="200" max="700" step="10" value="350" /></label>
    <label>Settle time (ms) <b id="v_settleMs"></b><input id="settleMs" type="range" min="40" max="300" step="10" value="120" /></label>
    <label>IR brightness ≥ <b id="v_irMin"></b><input id="irMin" type="range" min="80" max="255" step="1" value="190" /></label>
    <div class="small mono" id="debugInfo"></div>
    <p class="small muted">Correlation map of the last scan (white = follows the code):</p>
    <canvas id="heat"></canvas>
    <button id="clearBtn">Clear confirmations and snapshots</button>
  </aside>

  <script type="module" src="/src/scan.js"></script>
</body>
</html>
