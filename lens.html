<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>VICTOR · Lens check</title>
  <script type="module" crossorigin src="./assets/lens-Bc_RBHbH.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/config-BEN-tLYE.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-TI05uVEd.js">
  <link rel="modulepreload" crossorigin href="./assets/code-Dygr-lMv.js">
  <link rel="modulepreload" crossorigin href="./assets/store-Clq8ImiC.js">
  <link rel="modulepreload" crossorigin href="./assets/cam-page-BICgZUK4.js">
  <link rel="stylesheet" crossorigin href="./assets/ui-DZxvSkRf.css">
<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
<body class="cam">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <header class="cam-top">
    <a class="icon-btn" href="./" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span class="title">Lens check</span>
    <button class="icon-btn" id="supportBtn" aria-pressed="false" aria-controls="support">Phone</button>
    <button class="icon-btn" id="detailsBtn" aria-pressed="false" aria-controls="details">Details</button>
  </header>

  <p id="status" class="cam-status" role="status" aria-live="polite">Point the phone at the area. Hold steady. Then move a little to the side and scan again.</p>

  <div class="cam-bottom">
    <div id="bits" class="bits" aria-hidden="true"></div>
    <button id="scanBtn" class="shutter">Start camera</button>
    <div class="cam-row">
      <button id="saveBtn" class="ghost" disabled>Save this spot</button>
      <a id="nextBtn" class="ghost" href="ir.html">Next: IR check</a>
    </div>
    <p id="saved" class="cam-foot"></p>
  </div>

  <aside id="support" class="sheet" hidden>
    <h3>What this phone supports</h3>
    <table id="supportTable"><tr><td>Start the camera first.</td></tr></table>
  </aside>

  <aside id="details" class="sheet" hidden>
    <h3>Details</h3>
    <div class="mono" id="debugInfo">No scan yet.</div>
    <canvas id="heat" aria-label="Map of how closely each pixel followed the code"></canvas>
    <div id="sliders"></div>
    <button class="ghost" id="clearBtn" type="button">Forget spots from earlier scans</button>
    <button class="ghost" id="recalBtn" type="button">Measure torch timing again</button>
  </aside>

</body>
</html>
