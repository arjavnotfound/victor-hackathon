# Builds the Android app on GitHub and attaches CRCD.apk to a Release.
# To turn on: move this file to .github/workflows/ (needs a GitHub login with
# the "workflow" permission: gh auth refresh -s workflow), then push a tag:
#   git tag v1.0.1 && git push --tags
name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npx vite build && npx cap sync android
      - run: cd android && ./gradlew assembleDebug --quiet
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CRCD.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: CRCD.apk }
