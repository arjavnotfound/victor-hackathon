<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VICTOR</title>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .hero { padding: 72px 0 48px; }
    .hero h1 { font-size: clamp(30px, 6vw, 44px); max-width: 520px; }
    .hero p { font-size: 17px; max-width: 480px; }
    .tools a { display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
      padding: 20px 0; border-top: 1px solid var(--line); text-decoration: none; }
    .tools a:last-child { border-bottom: 1px solid var(--line); }
    .tools a:hover .name { text-decoration: underline; }
    .tools .name { font-size: 18px; font-weight: 600; }
    .tools .desc { color: var(--muted); font-size: 14px; text-align: right; }
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">VICTOR</a></header>
  <main class="wrap">
    <section class="hero">
      <h1>Find hidden cameras by making them react.</h1>
      <p class="muted">Blink a secret pattern at the room. A camera can't help answering in the same pattern.</p>
    </section>
    <section class="tools">
      <a href="/scan.html"><span class="name">Lens scan</span><span class="desc">Phone torch finds the lens</span></a>
      <a href="/challenge.html"><span class="name">Wi-Fi test</span><span class="desc">Screen flicker finds the streaming device</span></a>
    </section>
    <p class="muted small" style="margin-top:40px">Runs in your browser. Nothing is uploaded.</p>
  </main>
</body>
</html>
