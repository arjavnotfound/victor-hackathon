<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>VICTOR · Results</title>
  <link rel="stylesheet" href="src/app.css" />
  <style>
    .summary { font-size: 22px; font-weight: 600; line-height: 1.3; margin: 4px 0 8px; letter-spacing: -.02em; }
    .spot img { width: 100%; border-radius: 8px; display: block; margin-bottom: 8px; }
    .actions { margin-top: 28px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar"><a class="back" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Home</a><span class="brand" data-app-name>VICTOR</span></div>
    <h1>Results</h1>
    <p id="summary" class="summary"></p>
    <p id="limits" class="muted small"></p>

    <div class="label">What was checked</div>
    <ul id="checks" class="group"></ul>

    <section id="spotsSec" hidden>
      <div class="label">Spots worth a closer look</div>
      <ul id="spots" class="group"></ul>
    </section>

    <section id="netSec" hidden>
      <div class="label">From the network check</div>
      <ul id="netList" class="group"></ul>
    </section>

    <div class="actions">
      <button id="reportBtn" class="btn primary">Save report (PDF)</button>
      <p id="reportNote" class="muted small" hidden></p>
      <a class="btn" href="help.html">If you found something</a>
      <a id="againBtn" class="btn" href="lens.html">Check again</a>
      <button id="clearBtn" class="link-btn" type="button">Clear results and start fresh</button>
    </div>
  </main>
  <script type="module" src="./src/results-page.js"></script>
</body>
</html>
