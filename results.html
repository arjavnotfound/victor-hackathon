<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f3ee" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>VICTOR · Results</title>
  <style>.summary{font-family:var(--serif);margin:0 0 12px;font-size:24px;line-height:1.3}.checks{border-top:1px solid var(--line);margin:0 0 28px;padding:0;list-style:none}.checks li{border-bottom:1px solid var(--line);justify-content:space-between;gap:16px;padding:14px 0;display:flex}.checks li span:first-child{flex:none}.checks li span:last-child{color:var(--muted);text-align:right;font-size:15px}.spot{margin:0 0 20px}.spot img{background:var(--soft);border-radius:12px;width:100%;display:block}.spot p{margin:8px 0 0}.spot .when{color:var(--muted);font-size:14px}h2{margin-top:32px}.actions{margin-top:28px}.hash{word-break:break-all;margin-top:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;display:block}.clear{color:var(--muted);font:inherit;cursor:pointer;background:0 0;border:0;min-height:48px;margin-top:16px;padding:0;font-size:15px;text-decoration:underline}</style>
  <script type="module" crossorigin src="./assets/results-AleCdZjw.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/config-BEN-tLYE.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-DPQzKwb9.js">
  <link rel="modulepreload" crossorigin href="./assets/store-Clq8ImiC.js">
  <link rel="modulepreload" crossorigin href="./assets/code-Dygr-lMv.js">
  <link rel="modulepreload" crossorigin href="./assets/report-D87KWX5q.js">
  <link rel="stylesheet" crossorigin href="./assets/ui-fZuxDoSV.css">
<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
<body>
  <main class="page">
    <div class="topbar"><a class="back" href="./">&larr; Home</a><span class="brand" data-app-name>VICTOR</span></div>
    <h1>Results</h1>
    <p id="summary" class="summary"></p>
    <p id="limits" class="muted small"></p>

    <h2>What was checked</h2>
    <ul id="checks" class="checks"></ul>

    <section id="spotsSec" hidden>
      <h2>Spots worth a closer look</h2>
      <div id="spots"></div>
    </section>

    <div class="actions">
      <button id="reportBtn" class="btn primary">Save report (PDF)</button>
      <p id="reportNote" class="muted small" hidden></p>
      <a class="btn" href="help.html">If you found something</a>
      <a id="againBtn" class="btn" href="lens.html">Check again</a>
      <button id="clearBtn" class="clear" type="button">Clear results and start fresh</button>
    </div>
  </main>
</body>
</html>
